<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}qa-calendar{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">qa<span> / </span>calendar</a>
    {% if user %}
    <div class="account"><span data-testid="current-user">{{ user.username }}</span>
      <form action="/logout" method="post"><button class="quiet" data-testid="logout-button">Log out</button></form>
    </div>
    {% else %}<span class="pill">LOCAL TESTING</span>{% endif %}
  </header>
  {% block content %}{% endblock %}
</body>
</html>
